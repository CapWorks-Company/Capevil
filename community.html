<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capevil — Communauté</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦹</text></svg>">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <script src="js/mobile-guard.js"></script>
  <div class="topbar">
    <h1><span>Cap</span>evil</h1>
    <nav id="site-nav"></nav>
    <div id="account-bar"></div>
  </div>

  <div class="container">
    <div id="backend-warning" class="card card-danger hidden">
      ⚠️ La base de données a un problème. Merci de réessayer ultérieurement !
    </div>

    <div class="card card-header" style="display:flex;">
      <span>🏆 Envie de savoir qui cartonne ? <a href="account.html#top">Voir le classement Top Joueur</a> — plus tu reçois d'encouragements sur ton profil, plus tu montes.</span>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>🌍 Niveaux publiés par la communauté</h2>
        <div class="flex-row">
          <input type="search" id="search" placeholder="🔍 Rechercher un niveau…" />
          <button class="btn small" id="random-level-btn" title="Lance un niveau publié au hasard">🎲 Niveau aléatoire</button>
        </div>
      </div>
      <div class="level-grid" id="levels-list"></div>
    </div>
  </div>

  <script type="module" src="js/community.js"></script>
</body>
</html>
