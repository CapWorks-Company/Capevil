<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capevil — Jouer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦹</text></svg>">
<link rel="stylesheet" href="css/style.css" />
<style>
  canvas.flash { filter: brightness(2) saturate(0); }
  .keys-hint { font-size: 12px; color: var(--muted); text-align: center; padding-bottom: 10px; }
</style>
</head>
<body>
  <script src="js/mobile-guard.js"></script>
  <div class="topbar">
    <h1><span>Cap</span>evil</h1>
    <nav>
      <a class="btn small" href="index.html">&larr; Accueil</a>
      <button class="btn small" id="restart-btn">Recommencer</button>
      <div id="keybind-bar"></div>
      <div id="audio-bar"></div>
    </nav>
    <div id="account-bar"></div>
  </div>

  <div class="hud container" style="padding-top:12px;padding-bottom:0;">
    <div class="flex-row">
      <strong id="level-title">Niveau</strong>
      <span class="muted" id="level-author"></span>
      <span class="pill hidden" id="official-badge" title="Ce niveau à été approuvé par un admin.">🏅 officiel</span>
    </div>
    <div class="flex-row">
      <button class="btn small hidden" id="like-btn">💖 Liker (<span id="like-count">0</span>)</button>
      <button class="btn small hidden" id="report-btn">🚩 Signaler</button>
      <div class="stat">Morts : <b id="deaths">0</b></div>
    </div>
  </div>

  <div id="load-error" class="card card-danger hidden" style="margin:12px auto;max-width:640px;color:#ffb4b4;"></div>

  <div class="stage-wrap">
    <canvas id="stage" width="1000" height="560"></canvas>
  </div>
  <p class="keys-hint">Touches configurables avec le bouton ⌨ Touches (en haut) — par défaut : flèches pour bouger, espace pour sauter</p>

  <div id="win-overlay" class="overlay hidden">
    <div class="box">
      <h2>🏆 Niveau terminé !</h2>
      <p>Nombre de morts : <b id="win-deaths">0</b></p>
      <div class="flex-row center" style="margin-top:16px;">
        <button class="btn primary" id="win-restart">Rejouer</button>
        <a class="btn" href="index.html">Retour à l'accueil</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
