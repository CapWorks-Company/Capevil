# Config pour déployer ce site statique sur un Cloudflare Worker (Static
# Assets) — pas de code serveur nécessaire, Supabase fait déjà office de
# backend. Le "name" doit correspondre au Worker que tu as déjà créé
# (leveldevil.capkychannel.workers.dev) pour que `wrangler deploy` mette à
# jour ce même Worker au lieu d'en créer un nouveau.
name = "leveldevil"
compatibility_date = "2025-09-01"

[assets]
directory = "."
