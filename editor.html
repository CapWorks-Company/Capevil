<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Level Devil — Éditeur</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😈</text></svg>">
<link rel="stylesheet" href="css/style.css" />
<style>
  #stage-scroll { overflow: auto; max-height: 82vh; border: 1px solid var(--border); border-radius: 8px; background: #000; }
  /* The editor grid must render at exact 1-cell-per-40px, never squished by
     the shared canvas{max-width:100%} rule — large levels scroll instead. */
  #stage-scroll canvas#stage { max-width: none; width: auto; height: auto; display: block; }
  #pick-banner { background: #f4d35e; color: #14151f; padding: 8px 14px; border-radius: 8px; margin: 8px 12px 0; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
</style>
</head>
<body>
  <script src="js/mobile-guard.js"></script>
  <div class="topbar">
    <h1><span>Level</span> Devil — Éditeur</h1>
    <nav>
      <a class="btn small" href="index.html">&larr; Accueil</a>
      <input type="text" id="level-title-input" placeholder="Titre du niveau" style="width:180px;" />
      <input type="text" id="level-author-input" placeholder="Auteur (connecte-toi)" style="width:160px;" readonly />
    </nav>
    <div id="account-bar"></div>
  </div>

  <div class="topbar" style="border-top:1px solid var(--border);">
    <nav>
      <button class="btn small" id="new-level">Nouveau</button>
      <button class="btn small" id="load-demo">🎓 Charger la démo</button>
      <button class="btn small" id="save-local">💾 Sauver (local)</button>
      <button class="btn small" id="export-json">⭳ Exporter JSON</button>
      <label class="btn small" style="cursor:pointer;">⭱ Importer JSON<input type="file" id="import-json" accept="application/json" style="display:none;" /></label>
      <button class="btn small accent" id="playtest-btn">▶ Tester le niveau</button>
      <button class="btn small" id="debug-view-btn" style="display:none;">🐞 Vue debug</button>
      <div id="keybind-bar" style="display:inline-flex;"></div>
      <div id="audio-bar" style="display:inline-flex;"></div>
      <button class="btn small primary" id="publish-btn">🚀 Publier</button>
    </nav>
    <nav>
      <button class="btn small" id="level-settings-btn">⚙ Niveau <span id="level-settings-label" class="muted" style="font-size:11px;"></span></button>
    </nav>
  </div>
  <div id="pick-banner" class="hidden">
    <span>Clique sur un élément de la grille pour le choisir comme cible…</span>
    <button class="btn small" id="cancel-pick">Annuler</button>
  </div>

  <div id="level-settings-modal" class="modal-backdrop hidden">
    <div class="modal-box" role="dialog" aria-modal="true" style="max-width:420px;">
      <button class="modal-close" id="level-settings-close" aria-label="Fermer">✕</button>
      <h2>⚙ Paramètres du niveau</h2>

      <label style="font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:block;margin-top:16px;">Taille de la grille</label>
      <div style="display:flex;gap:10px;margin-top:6px;">
        <div style="flex:1;">
          <span class="muted" style="font-size:12px;">Colonnes</span>
          <input type="number" id="cols-input" style="width:100%;margin-top:4px;" />
        </div>
        <div style="flex:1;">
          <span class="muted" style="font-size:12px;">Lignes</span>
          <input type="number" id="rows-input" style="width:100%;margin-top:4px;" />
        </div>
      </div>

      <label style="font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:block;margin-top:20px;">Zone éditable</label>
      <p class="muted" style="font-size:12px;margin:4px 0 8px;line-height:1.4;">En dehors de ces bornes, la grille est protégée contre les modifications (utile pour préserver un cadre décoratif).</p>
      <div style="display:flex;gap:10px;">
        <div style="flex:1;">
          <span class="muted" style="font-size:12px;">Colonnes (min – max)</span>
          <div style="display:flex;gap:6px;margin-top:4px;">
            <input type="number" id="eb-colmin" style="width:100%;" />
            <input type="number" id="eb-colmax" style="width:100%;" />
          </div>
        </div>
        <div style="flex:1;">
          <span class="muted" style="font-size:12px;">Lignes (min – max)</span>
          <div style="display:flex;gap:6px;margin-top:4px;">
            <input type="number" id="eb-rowmin" style="width:100%;" />
            <input type="number" id="eb-rowmax" style="width:100%;" />
          </div>
        </div>
      </div>

      <button class="btn small primary" id="level-settings-done" style="width:100%;margin-top:22px;">Terminé</button>
    </div>
  </div>
  <div class="container" style="max-width:1300px;">
    <p id="status-msg" class="muted" style="min-height:18px;"></p>
    <div class="editor-layout">
      <div id="toolbox"></div>
      <div id="stage-scroll"><canvas id="stage" width="1440" height="560"></canvas></div>
      <div id="props"></div>
    </div>
  </div>

  <script type="module" src="js/editor.js"></script>
</body>
</html>
